<div class="login-wrapper">
  <div class="login-container">
    
    <!-- Left Panel: Animated Branding & Context -->
    <div class="branding-panel">
      <!-- Live Animated Background Elements -->
      <div class="animation-container">
        <div class="glass-shape shape-1"></div>
        <div class="glass-shape shape-2"></div>
        <div class="glass-shape shape-3">
          <div class="mock-chart-bar bar-1"></div>
          <div class="mock-chart-bar bar-2"></div>
          <div class="mock-chart-bar bar-3"></div>
        </div>
      </div>
      
      <div class="branding-content">
        <div class="logo">
          <span class="logo-icon">💸</span> OutFlow
        </div>
        <h1>Master your finances.</h1>
        <p>Track every penny, analyze your spending habits, and hit your financial goals effortlessly.</p>
      </div>
    </div>

    <!-- Right Panel: Google OAuth Form -->
    <div class="auth-panel">
      <div class="auth-content">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to access your dashboard.</p>

        <button class="google-btn" (click)="loginWithGoogle()" id="google-button">
          <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google Logo" class="google-icon" />
          Continue with Google
        </button>

        <div class="divider">
          <span>Secure login</span>
        </div>

        <p class="terms">
          By continuing, you agree to SpendSmart's <br>
          <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </p>
      </div>
    </div>

  </div>
</div>
